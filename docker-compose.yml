version: '3.8'

services:
  # Backend API (FastAPI)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: vetor_backend
    restart: always
    ports:
      - "8006:8006"
    environment:
      - ENVIRONMENT=production
      - DATABASE_URL=sqlite:///./vetor_estrategico.db
      - COMMERCIAL_EMAIL=contato.vetorestrategico@gmail.com
      - COMMERCIAL_PHONE=+5511953099049
    volumes:
      - backend_data:/app
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8006/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend (Next.js 14)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vetor_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8006
      - NEXT_PUBLIC_SITE_URL=https://vetorestrategico.com.br
    depends_on:
      - backend

volumes:
  backend_data:
