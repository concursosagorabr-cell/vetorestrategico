services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution-api
    restart: always
    ports:
      - "8080:8080"
    environment:
      - SERVER_URL=http://localhost:8080
      - AUTHENTICATION_API_KEY=evolution-api-secret-key
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://postgres:postgres@evolution-db:5432/evolution?schema=public
      - DATABASE_SAVE_DATA_INSTANCE=true
      - DATABASE_SAVE_MESSAGE_UPDATE=true
      - WEBHOOK_GLOBAL_ENABLED=true
      - WEBHOOK_GLOBAL_URL=http://app:8008/webhook/evolution
      - WEBHOOK_GLOBAL_EVENTS_MESSAGES_UPSERT=true
      - WEBHOOK_GLOBAL_EVENTS_MESSAGES_UPDATE=true
      - CACHE_REDIS_ENABLED=true
      - CACHE_REDIS_URI=redis://redis:6379/1
    depends_on:
      evolution-db:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - evolution_store:/evolution/store

  evolution-db:
    image: postgres:15-alpine
    container_name: evolution-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: evolution
    volumes:
      - evolution_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d evolution"]
      interval: 5s
      timeout: 5s
      retries: 5

  app-db:
    image: postgres:15-alpine
    container_name: app-db
    restart: always
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: funnel_bot
    volumes:
      - app_pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d funnel_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6380:6379"

  app:
    build: .
    container_name: funnel-bot
    restart: always
    ports:
      - "8008:8008"
    env_file:
      - .env
    volumes:
      - ./src:/app/src
      - ./campaigns:/app/campaigns
      - ./logs:/app/logs
    depends_on:
      app-db:
        condition: service_healthy
      redis:
        condition: service_started
      evolution-api:
        condition: service_started
    command: uvicorn src.main:app --host 0.0.0.0 --port 8008 --reload --reload-dir src

volumes:
  evolution_store:
  evolution_pgdata:
  app_pgdata:
